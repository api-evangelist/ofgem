name: Ofgem
kind: company
description: >-
  Ofgem, the Office of Gas and Electricity Markets, is the non-ministerial government
  department that regulates the gas and electricity markets of Great Britain (England,
  Scotland and Wales), drawing its powers from the Gas Act 1986, the Electricity Act 1989
  and the Energy Act 2023. It licenses the companies that make, transport and sell energy,
  sets the price cap, runs the RIIO network price controls, administers environmental and
  social schemes such as the Renewables Obligation, REGO and Feed-in Tariffs on behalf of
  government, grants and supervises the Smart Meter Communication Licence held by the Smart
  DCC, and imposes the Data Best Practice licence obligation that requires network licensees
  to treat Energy System Data as presumed open. It sits above the value chain rather than in
  it - it holds no customers, no meters and no wires. Its own API posture is the plain
  finding: Ofgem publishes NO API of any kind. There is no developer portal, no api., docs.,
  data. or developer. subdomain, no OpenAPI, no CKAN endpoint. Market data is genuinely open
  but delivered as chart images, CSV and XLSX file downloads from the Ofgem Data Portal;
  consumer data does not exist here at all, because Great Britain mandated the smart-meter
  INFRASTRUCTURE rather than a consumer data right, and no CDR-equivalent obligation binds
  either Ofgem or the suppliers it licenses. Ofgem's two operational registers - the
  Electronic Public Register and the Renewable Electricity Register - are login-gated
  applications whose backends are undocumented and unpublished. Ofgem is therefore a
  regulator that demands open, discoverable, interoperable data from the industry it
  supervises while shipping none of it programmatically itself.
