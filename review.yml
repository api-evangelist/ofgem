artifacts:
  openapiHarvested: false
  specsCount: 0
  reason: >
    No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, Postman collection or JSON Schema
    document was found on any Ofgem host. Every /openapi.json, /swagger.json,
    /api-docs and /swagger/v1/swagger.json probe either 404ed or resolved to an SPA
    shell or a sign-in redirect. GraphQL introspection is disabled on the one live
    backend found. The openapi/ directory was therefore omitted rather than filled
    with anything invented or reconstructed.
