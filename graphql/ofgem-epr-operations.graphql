    futureEffectiveOnly: true
    publication: $publication
    orderBy: $orderBy
    limit: $limit
    offset: $offset
    nodeTypes: [SUPPLEMENTARY_FILE, DOCUMENT_CONTAINER]
  ) {
    count
    items {
      id
      name
      publicationParent {
        name
      }
      nodeType
      workVariant {
        filenameExtension
      }
      operationalPeriod {
        start
      }
    }
  }
}

mutation SubscribeAlertViaPlacement($input: SubscribeViaPlacementInput) {
  subscribeViaPlacement(input: $input)
}

mutation UnsubscribeAlertViaPlacement($input: UnsubscribeViaPlacementInput) {
  unsubscribeViaPlacement(input: $input)
}

query GetComponentOfPlacement($workVariantPlacementId: UUID) {
  placement: workVariantPlacement(id: $workVariantPlacementId) {
    componentOf {
      id
    }
  }
}

query GetChangesDiff($firstDocId: UUID, $firstIdAsOfRevision: UUID, $secondDocId: UUID, $secondIdAsOfRevision: UUID) {
  diff(
    firstDocId: $firstDocId
    firstIdAsOfRevision: $firstIdAsOfRevision
    secondDocId: $secondDocId
    secondIdAsOfRevision: $secondIdAsOfRevision
  ) {
    htmlDiff
  }
}
